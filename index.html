<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neural Cellular Automata</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Neural Cellular Automata</h1>
        <p>Welcome to the Cellular Automata project!</p>
        <p>Use the controls below to interact with the simulation:</p>
        <div class="controls">
            <button id="startButton">Start Simulation</button>
            <button id="stopButton">Stop Simulation</button>
            <button id="resetButton">Reset Simulation</button>
            <input type="range" id="fpsSlider" min="1" max="60" value="30">
            <label for="fpsSlider">FPS:</label>
            <span id="fpsValue">30</span>
            <label for="patternSelector">Pattern:</label>
            <select id="patternSelector">
                <option value="pattern1">Pattern 1</option>
                <option value="pattern2">Pattern 2</option>
                <option value="pattern3">Pattern 3</option>
            </select>
            <input type="range" id="gridSizeSlider" min="10" max="100" value="50">
            <label for="gridSizeSlider">Grid Size:</label>
            <span id="gridSizeValue">50</span>
            <input type="button" id="stepButton" value="Step Simulation">
            <input type="button" id="pauseButton" value="Pause Simulation">
            <input type="button" id="randomButton" value="Randomize">
            <div class="toggle-row">
                <input type="checkbox" id="showgridlines">
                <label for="showgridlines">Show Grid Lines</label>
            </div>
        </div>
        <canvas id="simulationCanvas" width="800" height="600"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
