<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neural Cellular Automata</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Neural Cellular Automata</h1>
        <p>Welcome to the Neural Cellular Automata project! This project explores the fascinating world of cellular automata and how neural networks can be used to simulate complex behaviors.</p>
        <p>Use the controls below to interact with the simulation:</p>
        <div class="controls">
            <button id="startButton">Start Simulation</button>
            <button id="stopButton">Stop Simulation</button>
            <button id="resetButton">Reset Simulation</button>
        </div>
        <canvas id="simulationCanvas" width="800" height="600"></canvas>
    </div>

    <script src="script.js"></script>
    <area id="simulationArea" shape="rect" coords="0,0,800,600" href="#" alt="Simulation Area">
</body>
</html>
